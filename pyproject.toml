[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-agent"
version = "0.1.0"
description = "LLM-агент для анализа отзывов покупателей и формирования рекомендаций по развитию товара"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "razdel>=0.5",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
