[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "review-agent"
version = "0.1.0"
description = "LLM-агент для анализа отзывов покупателей и рекомендаций по развитию товара"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "razdel>=0.5",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "httpx>=0.27",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["python-docx>=1.1"]
ui = ["streamlit>=1.40"]
# Нейросетевые эмбеддинги для шага 6 (тяжёлая зависимость: torch)
embeddings = ["sentence-transformers>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
review_agent = ["prompts/*.md", "taxonomy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
